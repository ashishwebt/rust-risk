[workspace]
resolver = "2"
members = ["risk_core", "data_feed", "app"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tracing-appender = "0.2"

[profile.release]
opt-level = 3
lto = true
